name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: unit tests
        run: node --test test/*.test.js
      - name: release self-check
        run: node scripts/release-check.mjs
      - name: publish to npm (skip when the version already exists)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          FOUND=0
          for attempt in 1 2 3 4 5 6; do
            if node -e "const n=process.argv[1],v=process.argv[2];fetch('https://registry.npmjs.org/'+encodeURIComponent(n).replace('%40','@')+'/'+v).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" "$NAME" "$VERSION"; then
              FOUND=1
              break
            fi
            sleep 10
          done
          if [ "$FOUND" = "1" ]; then
            echo "$NAME@$VERSION is already published; skipping npm publish"
          elif [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "$NAME@$VERSION is not visible on the registry yet and NPM_TOKEN is not configured; skipping this workflow's publish (the version is published out of band)"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: pack and checksum
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist && sha256sum *.tgz > SHA256SUMS
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
